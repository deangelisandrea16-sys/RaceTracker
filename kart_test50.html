<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Race Tracker">
<title>Race Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0b">
<link rel="apple-touch-icon" sizes="180x180" href="icons/rt2-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/rt2-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/rt2-16.png">
<link rel="shortcut icon" href="favicon.ico">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0b0f;--bg2:#161922;--bg3:#1e222e;
  --border:#262b38;--border2:#39404f;
  --text:#f6f8fc;--text2:#dde2ec;--text3:#a7b0c0;--text4:#717c90;
  --task-border:#39404f;--task-color:#a7b0c0;
  --modal-bg:#13161e;--input-bg:#0c0e14;
  --btn-bg:#222636;--btn-color:#f6f8fc;
  --accent:#30d158;--accent-dim:rgba(48,209,88,.14);
  --blue:#0a84ff;--blue-dim:rgba(10,132,255,.15);
  --amber:#ffd60a;--red:#ff453b;
  --radius:18px;--radius-sm:12px;--radius-xs:9px;--pill:999px;
  --shadow:0 12px 34px -18px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.04) inset;
  --shadow-pop:0 26px 60px -22px rgba(0,0,0,.85);
  --glass:rgba(14,16,24,.72);
  --ease:cubic-bezier(.22,.85,.26,1);
  --tab-h:64px;--safe-b:max(env(safe-area-inset-bottom),12px);
}
body.light{
  --bg:#eceef2;--bg2:#ffffff;--bg3:#f4f6fa;
  --border:#e0e3ea;--border2:#c6ccd6;
  --text:#0b0d12;--text2:#1d222b;--text3:#4a5160;--text4:#828b9c;
  --task-border:#c6ccd6;--task-color:#5a6273;
  --modal-bg:#ffffff;--input-bg:#f1f3f7;
  --btn-bg:#eaecf1;--btn-color:#1d222b;
  --accent:#15a64a;--accent-dim:rgba(21,166,74,.12);
  --blue:#0a84ff;--blue-dim:rgba(10,132,255,.1);
  --amber:#c8920a;--red:#e0352b;
  --glass:rgba(255,255,255,.72);
  --shadow:0 12px 30px -20px rgba(20,30,60,.4),0 1px 0 rgba(255,255,255,.6) inset;
  --shadow-pop:0 26px 60px -24px rgba(20,30,60,.45);
}
html{background:var(--bg);overflow-x:hidden;overflow-y:auto;height:100%;}
html,body{overscroll-behavior-x:none;}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--tab-h) + var(--safe-b) + 12px);transition:background .25s,color .25s;-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-y:auto;letter-spacing:-.01em;}
.pilot-num,.inner-num,.sr-num,.entry-num,.slot-time,.final-time,.race-name{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;letter-spacing:-.02em;}
/* HEADER (frosted) */
.header{padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;position:sticky;top:0;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--border);z-index:100;display:flex;align-items:center;justify-content:space-between;}
.header::before{content:'';position:absolute;inset:-200px 0 auto 0;height:200px;background:var(--bg);z-index:-1;}
.header-dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;margin-right:8px;box-shadow:0 0 8px var(--red);animation:pulse 2s infinite;}
.header-dot.connected{background:var(--accent);box-shadow:0 0 10px var(--accent);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.header-sub{font-size:10px;color:var(--text4);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:3px;font-weight:700;}
.header-title{font-size:23px;font-weight:800;color:var(--text);letter-spacing:-.02em;}
.header-right{display:flex;gap:8px;align-items:center;}
.theme-btn{background:var(--bg2);border:1px solid var(--border);border-radius:var(--pill);width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--text);transition:transform .15s var(--ease);}
.theme-btn:active{transform:scale(.9);}
.sync-status{font-size:10px;font-weight:700;color:var(--text4);letter-spacing:1px;}
.sync-status.ok{color:var(--accent);}.sync-status.err{color:var(--red);}
/* TOP NAV (current section label) */
.nav-bar{display:flex;align-items:center;background:transparent;padding:10px 18px 4px;}
.nav-current{font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);flex:1;}
.menu-btn{display:none;}
/* hamburger kept as secondary (debug/overflow) */
.fab-menu{display:none!important;position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:18px;width:38px;height:38px;border-radius:var(--pill);background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:15px;cursor:pointer;z-index:101;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease);}
.fab-menu:active{transform:scale(.9);}
.nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:150;display:none;align-items:flex-end;}
.nav-overlay.open{display:flex;}
.nav-menu{background:var(--modal-bg);border-radius:26px 26px 0 0;width:100%;padding:14px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--border);box-shadow:var(--shadow-pop);}
.nav-menu::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:var(--border2);margin:2px auto 14px;}
.nav-item{display:flex;align-items:center;gap:14px;padding:15px 14px;border-radius:14px;cursor:pointer;font-size:15px;font-weight:700;color:var(--text2);letter-spacing:0;border:none;background:none;width:100%;text-align:left;transition:background .15s;}
.nav-item:active{background:var(--bg3);}
.nav-item.active{color:var(--accent);background:var(--accent-dim);}
.nav-item-icon{font-size:19px;width:28px;text-align:center;}
.nav-close{font-size:13px;font-weight:700;color:var(--text4);text-align:center;padding:14px;cursor:pointer;letter-spacing:1px;}
/* FILTER CHIPS (pills) */
.filter-bar{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.filter-chip{padding:8px 14px;border-radius:var(--pill);border:1px solid var(--border2);background:var(--bg2);color:var(--text3);font-size:11px;font-weight:700;letter-spacing:.3px;cursor:pointer;text-transform:uppercase;transition:all .15s var(--ease);}
.filter-chip:active{transform:scale(.94);}
.filter-chip.active{color:#fff;border-color:var(--accent);background:var(--accent);}
body.light .filter-chip.active{color:#fff;}
.filter-chip.f-green{border-color:#1f7a44;color:#54d98a;}
.filter-chip.f-green.active{background:#0f6d3a;border-color:#0f6d3a;color:#eafff2;}
.filter-chip.f-orange{border-color:#9a6411;color:#fbbf24;}
.filter-chip.f-orange.active{background:#8a5a10;border-color:#8a5a10;color:#fff7e6;}
.filter-chip.f-red{border-color:#9a2b27;color:#ff7a72;}
.filter-chip.f-red.active{background:#8a1f1c;border-color:#8a1f1c;color:#ffeceb;}
body.light .filter-chip.f-green{color:#15803d;border-color:#86d6a6;}
body.light .filter-chip.f-green.active{background:#15a64a;color:#fff;}
body.light .filter-chip.f-orange{color:#b45309;border-color:#f1c879;}
body.light .filter-chip.f-orange.active{background:#c8920a;color:#fff;}
body.light .filter-chip.f-red{color:#b91c1c;border-color:#f0a6a2;}
body.light .filter-chip.f-red.active{background:#e0352b;color:#fff;}
/* SEGMENTED SUBTABS */
.subtabs{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:13px;padding:4px;margin:12px 16px 0;}
.subtab{flex:1;padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;background:none;border:none;color:var(--text4);cursor:pointer;border-radius:10px;transition:all .18s var(--ease);}
.subtab.active{color:var(--text);background:var(--bg2);box-shadow:var(--shadow);}
.content{padding:16px 16px 8px;}
.hint{font-size:12px;color:var(--text4);margin-bottom:14px;font-weight:500;line-height:1.4;}
/* CARDS */
.card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--bg2);margin-bottom:14px;box-shadow:var(--shadow);}
.card-inner{border-radius:var(--radius-sm);padding:12px;background:var(--bg3);margin-bottom:8px;border:1px solid var(--border);}
.card-inner:last-child{margin-bottom:0;}
.pilot-cat{font-size:11px;font-weight:800;letter-spacing:2.5px;}
.pilot-index{font-size:12px;font-weight:700;color:var(--text4);min-width:22px;text-align:right;margin-right:2px;}
.pilot-num{font-size:22px;font-weight:800;color:var(--text);}
.pilot-name{font-size:14px;font-weight:600;color:var(--text2);}
.pilot-team{font-size:14px;font-weight:700;color:var(--text3);margin-top:4px;letter-spacing:0;}
.pilot-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.parity-badge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:var(--pill);border:1px solid var(--border2);color:var(--text3);}
.group-badge{font-size:11px;font-weight:800;padding:4px 11px;border-radius:var(--pill);border:1.5px solid var(--border2);color:var(--text);}
.group-badge.set{border-color:var(--blue);color:var(--blue);background:var(--blue-dim);}
.pilot-edit-btn{font-size:12px;font-weight:600;color:var(--text3);background:var(--bg3);border:1px solid var(--border);border-radius:var(--pill);padding:7px 13px;cursor:pointer;transition:all .15s var(--ease);}
.pilot-edit-btn:active{transform:scale(.94);}
/* TASK BUTTONS */
.tasks{display:flex;flex-wrap:wrap;gap:7px;}
.task-btn{font-size:12px;font-weight:700;padding:8px 13px;border-radius:var(--pill);border:1px solid var(--task-border);color:var(--task-color);background:var(--bg2);cursor:pointer;transition:all .15s var(--ease);letter-spacing:.2px;}
.task-btn:active{transform:scale(.93);}
.task-btn.green{border-color:#1f7a44;background:#0c3a22;color:#5ee79b;}
.task-btn.orange{border-color:#9a6411;background:#37260a;color:#fbbf24;}
.task-btn.red{border-color:#9a2b27;background:#3a1411;color:#ff8a82;}
body.light .task-btn.green{background:#dcfce7;color:#15803d;border-color:#7fce9f;}
body.light .task-btn.orange{background:#fef3c7;color:#b45309;border-color:#edca7a;}
body.light .task-btn.red{background:#fee2e2;color:#b91c1c;border-color:#f0a6a2;}
.note-wrap{margin-top:12px;}
.note-label{font-size:10px;font-weight:800;color:var(--text4);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;display:block;}
.note-area{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-xs);padding:11px 13px;font-size:13px;font-weight:500;color:var(--text2);font-family:inherit;resize:none;outline:none;min-height:56px;transition:border-color .15s;}
.note-area:focus{border-color:var(--blue);}
.note-area::placeholder{color:var(--text4);}
/* IO + MGMT BUTTONS */
.io-row{display:flex;gap:10px;margin-bottom:12px;}
.io-btn{flex:1;padding:13px 8px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-xs);font-size:12px;font-weight:700;color:var(--btn-color);cursor:pointer;text-align:center;letter-spacing:.3px;transition:all .15s var(--ease);}
.io-btn:active{transform:scale(.97);}
.io-btn.export{border-color:var(--accent);color:var(--accent);}
.io-btn.import{border-color:var(--blue);color:var(--blue);}
.mgmt-btn{width:100%;padding:14px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-xs);font-size:14px;font-weight:700;color:var(--btn-color);cursor:pointer;margin-bottom:10px;letter-spacing:.2px;transition:all .15s var(--ease);}
.mgmt-btn:active{transform:scale(.99);}
/* SCHEDULE SLOTS */
.slot-time{font-size:20px;font-weight:800;color:var(--text);}
.slot-label{font-size:13px;font-weight:700;letter-spacing:.3px;}
.slot-type{font-size:10px;font-weight:700;color:var(--text4);margin-left:auto;letter-spacing:1px;background:var(--bg3);padding:3px 9px;border-radius:var(--pill);border:1px solid var(--border);}
.slot-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.inner-num{font-size:19px;font-weight:800;color:var(--text);}
.inner-name{font-size:13px;font-weight:600;color:var(--text2);}
.inner-team{font-size:11px;font-weight:500;color:var(--text4);margin-left:auto;}
.inner-group{font-size:11px;font-weight:800;color:var(--blue);margin-left:6px;}
/* DAY TABS */
.day-tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 2px;background:transparent;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{padding:9px 15px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:var(--bg2);border:1px solid var(--border);border-radius:var(--pill);color:var(--text4);cursor:pointer;white-space:nowrap;transition:all .15s var(--ease);}
.day-tab.active{color:#fff;border-color:var(--accent);background:var(--accent);}
body.light .day-tab.active{color:#fff;}
.session-divider{font-size:10px;font-weight:800;color:var(--text4);letter-spacing:2.5px;text-transform:uppercase;padding:16px 0 8px;margin-top:4px;display:flex;align-items:center;gap:10px;}
.session-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.session-divider:first-child{margin-top:0;}
/* FINALS */
.final-card{border:1px solid var(--amber);border-radius:var(--radius);padding:16px;background:linear-gradient(180deg,rgba(255,214,10,.06),transparent);margin-bottom:14px;box-shadow:var(--shadow);}
.final-title{font-size:14px;font-weight:800;color:var(--amber);letter-spacing:1.5px;margin-bottom:10px;}
.final-row{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text3);padding:6px 0;border-bottom:1px solid var(--border);}
.final-row:last-child{border-bottom:none;}
.final-time{font-weight:800;color:var(--text);}
/* SECTION EDITOR */
.section-editor{border-bottom:1px solid var(--border);padding:16px;background:var(--bg);}
.section-label{font-size:11px;font-weight:700;color:var(--text4);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.sections-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.section-chip{display:flex;align-items:center;gap:5px;padding:7px 12px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--pill);font-size:11px;font-weight:700;color:var(--text2);cursor:pointer;}
.section-chip .del{color:var(--text4);font-size:14px;}
.add-row{display:flex;gap:8px;}
.add-input{flex:1;padding:11px 13px;background:var(--input-bg);border:1px solid var(--border2);border-radius:var(--radius-xs);font-size:13px;font-weight:600;color:var(--text);outline:none;font-family:inherit;}
.add-input:focus{border-color:var(--blue);}
.add-btn{padding:11px 16px;background:var(--blue);border:none;border-radius:var(--radius-xs);font-size:12px;font-weight:700;color:#fff;cursor:pointer;}
/* TRACK GRIDS */
.track-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:7px;margin-top:8px;}
.track-btn{padding:10px 6px;border-radius:var(--radius-xs);border:1px solid var(--border2);background:var(--bg3);cursor:pointer;font-family:inherit;font-size:10px;font-weight:700;color:var(--text4);text-align:center;line-height:1.3;word-break:break-word;min-height:44px;display:flex;align-items:center;justify-content:center;transition:all .15s var(--ease);}
.track-btn:active{transform:scale(.95);}
.track-btn.green{background:#0c3a22;border-color:#1f7a44;color:#5ee79b;}
.track-btn.orange{background:#37260a;border-color:#9a6411;color:#fbbf24;}
.track-btn.red{background:#3a1411;border-color:#9a2b27;color:#ff8a82;}
body.light .track-btn.green{background:#dcfce7;border-color:#7fce9f;color:#15803d;}
body.light .track-btn.orange{background:#fef3c7;border-color:#edca7a;color:#b45309;}
body.light .track-btn.red{background:#fee2e2;border-color:#f0a6a2;color:#b91c1c;}
.track-session-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(55px,1fr));gap:7px;margin-top:8px;}
.track-pilot-btn{padding:8px 4px;border-radius:var(--radius-xs);border:1px solid var(--border2);background:var(--bg3);cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;color:var(--text4);text-align:center;min-height:42px;display:flex;align-items:center;justify-content:center;transition:all .15s var(--ease);font-variant-numeric:tabular-nums;}
.track-pilot-btn:active{transform:scale(.93);}
.track-pilot-btn.green{background:#0c3a22;border-color:#1f7a44;color:#5ee79b;}
.track-pilot-btn.orange{background:#37260a;border-color:#9a6411;color:#fbbf24;}
.track-pilot-btn.red{background:#3a1411;border-color:#9a2b27;color:#ff8a82;}
body.light .track-pilot-btn.green{background:#dcfce7;border-color:#7fce9f;color:#15803d;}
body.light .track-pilot-btn.orange{background:#fef3c7;border-color:#edca7a;color:#b45309;}
body.light .track-pilot-btn.red{background:#fee2e2;border-color:#f0a6a2;color:#b91c1c;}
.no-group-warning{font-size:10px;color:var(--amber);font-weight:600;margin-top:4px;}
.empty-state{padding:56px 20px;text-align:center;color:var(--text4);font-size:14px;font-weight:500;line-height:1.6;}
.loading{text-align:center;padding:48px;color:var(--text4);font-size:13px;font-weight:600;}
.no-pilots{font-size:12px;color:var(--text4);font-style:italic;padding:8px 0;}
/* NOW HIGHLIGHT */
.slot-now{border-color:var(--accent)!important;box-shadow:0 0 0 1.5px var(--accent),0 0 26px -6px var(--accent);}
.now-badge{font-size:9px;font-weight:800;color:var(--accent);letter-spacing:2px;animation:pulse 2s infinite;}
/* SEARCH */
.search-bar-wrap{padding:0 0 14px;}
.search-bar-container{position:relative;}
.search-bar{width:100%;padding:13px 42px 13px 15px;font-family:inherit;font-size:14px;font-weight:600;background:var(--bg3);border:1px solid var(--border);border-radius:13px;color:var(--text);outline:none;transition:border-color .15s;}
.search-bar::placeholder{color:var(--text4);font-weight:500;}
.search-bar:focus{border-color:var(--blue);}
.search-clear{background:none;border:none;color:var(--text4);font-size:18px;cursor:pointer;padding:0 4px;position:absolute;right:12px;top:50%;transform:translateY(-50%);}
.search-group-label{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--text4);padding:12px 0 6px;text-transform:uppercase;}
.search-result-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:13px;margin-bottom:7px;cursor:pointer;transition:transform .12s var(--ease);}
.search-result-item:active{transform:scale(.985);opacity:.85;}
.sr-num{font-size:21px;font-weight:800;color:var(--text);min-width:52px;}
.sr-name{font-size:13px;font-weight:600;color:var(--text2);}
.sr-team{font-size:12px;font-weight:600;color:var(--text3);}
.sr-cat{font-size:10px;font-weight:800;padding:3px 8px;border-radius:var(--pill);letter-spacing:.5px;}
/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;}
.modal{background:var(--modal-bg);border-radius:26px 26px 0 0;width:100%;max-width:600px;margin:0 auto;padding:14px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;border-top:1px solid var(--border);box-shadow:var(--shadow-pop);}
.modal::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:var(--border2);margin:2px auto 16px;}
.modal-title{font-size:19px;font-weight:800;margin-bottom:18px;color:var(--text);letter-spacing:-.02em;}
.modal-close{float:right;background:var(--bg3);border:none;color:var(--text3);font-size:16px;width:30px;height:30px;border-radius:var(--pill);cursor:pointer;display:flex;align-items:center;justify-content:center;}
/* FORMS */
.form-group{margin-bottom:16px;}
.form-label{font-size:11px;font-weight:700;color:var(--text4);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;display:block;}
.form-input,.form-select,.form-textarea{width:100%;background:var(--input-bg);border:1px solid var(--border2);border-radius:12px;padding:13px 14px;font-size:15px;font-weight:500;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue);}
.form-select{-webkit-appearance:none;appearance:none;}
.form-textarea{font-size:14px;resize:none;min-height:80px;}
select.form-input option,select.form-select option{background:var(--modal-bg);color:var(--text);}
.form-submit{width:100%;padding:15px;background:var(--accent);color:#fff;border:none;border-radius:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;letter-spacing:.2px;transition:transform .12s var(--ease);}
.form-submit:active{transform:scale(.98);}
body.light .form-submit{color:#fff;}
.form-delete{width:100%;padding:14px;background:none;color:var(--red);border:1.5px solid var(--red);border-radius:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;}
/* RACE CARDS */
.race-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:var(--bg2);margin-bottom:14px;cursor:pointer;transition:transform .14s var(--ease);box-shadow:var(--shadow);}
.race-card:active{transform:scale(.985);opacity:.9;}
.race-card.active-race{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent),var(--shadow);}
.race-name{font-size:17px;font-weight:800;color:var(--text);margin-bottom:5px;letter-spacing:-.01em;}
.race-meta{font-size:12px;color:var(--text4);font-weight:600;}
.race-badge{display:inline-block;font-size:9px;font-weight:800;padding:3px 9px;border-radius:var(--pill);letter-spacing:.5px;background:var(--accent);color:#04150a;margin-left:8px;vertical-align:middle;}
/* UPLOAD ZONES */
.upload-zone{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;margin-bottom:12px;transition:all .15s var(--ease);background:var(--bg3);}
.upload-zone:active{border-color:var(--blue);}
.upload-zone-label{font-size:13px;font-weight:700;color:var(--text3);margin-bottom:4px;}
.upload-zone-hint{font-size:11px;color:var(--text4);}
.upload-zone.loaded{border-color:var(--accent);border-style:solid;background:var(--accent-dim);}
/* DETAIL SHEET */
.detail-sheet{padding:4px 0;}
.detail-actions{display:flex;gap:10px;margin-top:14px;}
.detail-actions button{flex:1;padding:13px;border-radius:12px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.2px;transition:transform .12s var(--ease);}
.detail-actions button:active{transform:scale(.97);}
.btn-add-pilot{background:var(--accent);color:#04150a;border:none;}
.btn-note-pilot{background:var(--bg3);border:1px solid var(--border2);color:var(--btn-color);}
/* CATEGORY COLORS */
.cat-kz2{color:#ff7a72;} body.light .cat-kz2{color:#dc2626;}
.cat-ok{color:#5aa6ff;} body.light .cat-ok{color:#2563eb;}
.cat-okj{color:#c99bff;} body.light .cat-okj{color:#7c3aed;}
.cat-gr3{color:#42e0a6;} body.light .cat-gr3{color:#059669;}
.cat-u10{color:#3bdcf0;} body.light .cat-u10{color:#0891b2;}
.cat-nj{color:#ffce4a;} body.light .cat-nj{color:#d97706;}
.cat-okn{color:#f472b6;} body.light .cat-okn{color:#db2777;}
/* TEAM */
.pv-switch{display:flex;gap:8px;margin-bottom:12px;}
.pv-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border2);background:none;color:var(--text4);font-family:inherit;font-weight:900;font-size:12px;letter-spacing:1px;cursor:pointer;}
.pv-btn.active{border-color:#22c55e;color:#22c55e;background:rgba(34,197,94,.08);}
.team-card{border-left:4px solid #a78bfa;}
.team-nums{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.team-num{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;border:1px solid var(--border2);color:var(--text3);cursor:pointer;}
.team-num.mine{border-color:#22c55e;color:#22c55e;}
.team-inner{border-left:3px solid #a78bfa;}
.btn-add-team{width:100%;padding:11px;border-radius:8px;border:none;background:#a78bfa;color:#000;font-family:inherit;font-weight:900;font-size:12px;letter-spacing:1px;cursor:pointer;margin-bottom:10px;}
.btn-add-team.done{background:none;border:1.5px solid #a78bfa;color:#a78bfa;}
/* VISTA GENERALE */
.ov-btn{width:100%;padding:10px;border-radius:10px;border:1.5px solid #60a5fa;background:none;color:#60a5fa;font-family:inherit;font-weight:900;font-size:12px;letter-spacing:1px;cursor:pointer;margin-bottom:8px;}
.ltc{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.ltc th{font-size:9px;letter-spacing:1px;color:var(--text4);text-align:left;padding:4px 4px;border-bottom:1px solid var(--border2)}
.ltc td{padding:6px 4px;border-bottom:1px solid var(--border);white-space:nowrap}
.ltc td.n{font-weight:900}.ltc td.d{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.ltc tr.mine td{background:rgba(34,197,94,.18);color:#4ade80;font-weight:800}
.ltc tr.mine td.n{color:#fff;background:#16a34a}
.ltc tr.team td{background:rgba(167,139,250,.14);color:#c4b5fd}
.ltc .best{color:#c084fc}.ltc .pb{color:#4ade80}
.ltbig{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:rgba(34,197,94,.12);border:1.5px solid #16a34a;cursor:pointer}
.ltbig.team{background:rgba(167,139,250,.10);border-color:#a78bfa}
.ltbig .pos{font-size:40px;font-weight:900;min-width:58px;text-align:center;line-height:1;color:#fff}
.ltbig .num{font-size:22px;font-weight:900;color:#4ade80}
.ltbig.team .num{color:#c4b5fd}
.ltbig .nm{font-size:13px;font-weight:800;color:var(--text)}
.ltbig .sub{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;margin-top:3px}
.rt-alerts{position:fixed;top:8px;left:8px;right:8px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.rt-alert{pointer-events:auto;padding:12px 14px;border-radius:12px;background:#111827;border:2px solid #fbbf24;color:#fff;font-size:13px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;gap:10px;align-items:flex-start}
.rt-alert.gold{border-color:#facc15;background:#3b2f05}.rt-alert.final{border-color:#22c55e;background:#052e16}
.rt-alert small{display:block;font-weight:600;color:#d1d5db;margin-top:2px;font-size:11px}
.ov-row{display:flex;align-items:flex-start;gap:8px;padding:5px 2px;border-bottom:1px solid var(--border);}
.ov-row.past{opacity:.35;}
.ov-row.now{background:rgba(34,197,94,.10);border-radius:6px;}
.ov-time{font-size:12px;font-weight:900;min-width:40px;color:var(--text);}
.ov-cat{font-size:10px;font-weight:800;min-width:74px;}
.ov-nums{display:flex;flex-wrap:wrap;gap:4px;flex:1;}
.ov-n{font-size:12px;font-weight:900;padding:1px 6px;border-radius:5px;border:1px solid var(--border2);cursor:pointer;}
.ov-n.red{border-color:#dc2626;color:#f87171;}.ov-n.orange{border-color:#d97706;color:#fbbf24;}.ov-n.green{border-color:#16a34a;color:#4ade80;}
.ov-t{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;border:1px dashed #a78bfa;color:#a78bfa;cursor:pointer;}
.ov-t.green{border-style:solid;border-color:#16a34a;color:#4ade80;}.ov-t.orange{border-style:solid;border-color:#d97706;color:#fbbf24;}
/* FABs (raised above tab bar) */
.fab-now{position:fixed;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);right:18px;width:52px;height:52px;border-radius:var(--pill);background:var(--accent);color:#04150a;border:none;font-size:11px;font-weight:800;cursor:pointer;z-index:90;box-shadow:0 10px 26px -8px var(--accent);letter-spacing:.5px;display:none;transition:transform .15s var(--ease);}
.fab-now.visible{display:flex;align-items:center;justify-content:center;}
.fab-now:active{transform:scale(.9);}
.fab-top{position:fixed;bottom:calc(var(--tab-h) + var(--safe-b) + 78px);right:18px;width:44px;height:44px;border-radius:var(--pill);background:var(--bg2);border:1px solid var(--border2);color:var(--text3);font-size:17px;cursor:pointer;z-index:90;box-shadow:var(--shadow);display:none;align-items:center;justify-content:center;}
.fab-top.visible{display:flex;}
button,.tabbar-btn,.fab-now,.fab-top,.nav-item{touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,0);}
/* LIVE TIMING */
.lt-wrap{position:relative;overflow:hidden;width:100%;height:calc(100vh - 210px);min-height:420px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);}
.live-timing-frame{position:absolute;top:0;left:0;width:100%;height:100%;border:none;background:var(--bg2);}
.lt-nudge{font-size:18px;font-weight:800;width:44px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg2);color:var(--text2);border:1px solid var(--border2);border-radius:8px;cursor:pointer;font-family:inherit;}
.lt-nudge:active{transform:scale(.92);}
.inner-team-big{font-size:13px;font-weight:700;color:var(--text2);}
body.light .inner-team-big{color:var(--text3);}
/* FILTER EXPANDED */
.filter-section{margin-bottom:14px;}
.filter-row{display:flex;gap:7px;margin-bottom:7px;flex-wrap:wrap;align-items:center;}
.filter-row-label{font-size:9px;font-weight:700;color:var(--text4);letter-spacing:1px;min-width:50px;text-transform:uppercase;}
/* ADVANCED SEARCH */
.adv-search-wrap{margin-bottom:14px;}
.adv-search-mode{display:flex;gap:7px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;}
.adv-search-mode::-webkit-scrollbar{display:none;}
.adv-mode-btn{padding:8px 14px;border-radius:var(--pill);border:1px solid var(--border2);background:var(--bg2);color:var(--text4);font-size:10px;font-weight:700;letter-spacing:.5px;cursor:pointer;white-space:nowrap;text-transform:uppercase;transition:all .15s var(--ease);}
.adv-mode-btn.active{color:#fff;border-color:var(--accent);background:var(--accent);}
body.light .adv-mode-btn.active{color:#fff;}
.adv-cat-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.adv-cat-btn{padding:8px 15px;border-radius:var(--pill);border:1.5px solid var(--border2);background:var(--bg2);color:var(--text4);font-size:11px;font-weight:800;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;transition:all .15s var(--ease);}
.adv-cat-btn.cat-kz2{border-color:#ff7a72;color:#ff7a72;}.adv-cat-btn.cat-kz2.active{background:rgba(255,122,114,.16);}
.adv-cat-btn.cat-ok{border-color:#5aa6ff;color:#5aa6ff;}.adv-cat-btn.cat-ok.active{background:rgba(90,166,255,.16);}
.adv-cat-btn.cat-okj{border-color:#c99bff;color:#c99bff;}.adv-cat-btn.cat-okj.active{background:rgba(201,155,255,.16);}
.adv-cat-btn.cat-gr3{border-color:#42e0a6;color:#42e0a6;}.adv-cat-btn.cat-gr3.active{background:rgba(66,224,166,.16);}
.adv-cat-btn.cat-u10{border-color:#3bdcf0;color:#3bdcf0;}.adv-cat-btn.cat-u10.active{background:rgba(59,220,240,.16);}
.adv-cat-btn.cat-nj{border-color:#ffce4a;color:#ffce4a;}.adv-cat-btn.cat-nj.active{background:rgba(255,206,74,.16);}
.adv-cat-btn.cat-okn{border-color:#f472b6;color:#f472b6;}.adv-cat-btn.cat-okn.active{background:rgba(244,114,182,.12);}
body.light .adv-cat-btn.cat-kz2{border-color:#dc2626;color:#dc2626;}
body.light .adv-cat-btn.cat-ok{border-color:#2563eb;color:#2563eb;}
body.light .adv-cat-btn.cat-okj{border-color:#7c3aed;color:#7c3aed;}
body.light .adv-cat-btn.cat-gr3{border-color:#059669;color:#059669;}
body.light .adv-cat-btn.cat-u10{border-color:#0891b2;color:#0891b2;}
body.light .adv-cat-btn.cat-nj{border-color:#d97706;color:#d97706;}
/* SCUDERIA LIST */
.scuderia-list{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:13px;margin-top:8px;}
.scuderia-item{padding:12px 15px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:1px solid var(--border);}
.scuderia-item:last-child{border-bottom:none;}
.scuderia-item:active{background:var(--bg3);}
.scuderia-item.selected{background:var(--blue-dim);color:var(--blue);}
/* ENTRY LIST */
.entry-list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.entry-count-badge{font-size:11px;font-weight:700;color:var(--text4);padding:5px 11px;border:1px solid var(--border);border-radius:var(--pill);letter-spacing:.5px;}
.entry-cat-filter{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.entry-cat-filter::-webkit-scrollbar{display:none;}
.entry-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:13px;margin-bottom:7px;cursor:pointer;transition:transform .12s var(--ease);}
.entry-item:active{transform:scale(.985);opacity:.85;}
.entry-item.is-mine{border-color:var(--accent);background:var(--accent-dim);}
.entry-num{font-size:19px;font-weight:800;color:var(--text);min-width:48px;}
.entry-name{font-size:13px;font-weight:600;color:var(--text2);}
.entry-team{font-size:12px;font-weight:600;color:var(--text3);}
.entry-badges{display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-left:auto;}
/* BOTTOM TAB BAR (iOS) */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;align-items:stretch;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--border);z-index:120;}
.tabbar-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text4);font-family:inherit;padding:8px 2px;transition:color .15s var(--ease);}
.tabbar-btn:active{opacity:.6;}
.tabbar-ico{font-size:21px;line-height:1;}
.tabbar-lbl{font-size:10px;font-weight:700;letter-spacing:.2px;}
.tabbar-btn.active{color:var(--accent);}
.tabbar-btn.active .tabbar-ico{transform:translateY(-1px);}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
@media(min-width:768px){
  /* Desktop: tutta la larghezza dello schermo, con le schede affiancate in più colonne */
  .content{max-width:none;margin:0;padding-left:24px;padding-right:24px;}
  #pilots-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;align-items:start;}
  #pilots-list>*{margin-bottom:0!important;}
  #pilots-list>:not(.card){grid-column:1/-1;}
  /* Programma: una sola colonna in ordine di orario; dentro ogni sessione i piloti affiancati */
  #schedule-content>.card{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;align-items:start;}
  #schedule-content>.card>.slot-header{grid-column:1;flex-direction:column;align-items:flex-start;gap:6px;margin:0;}
  #schedule-content>.card>:not(.slot-header){grid-column:2;margin-top:0!important;}
  #schedule-content>.card>div:not(.slot-header){display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:8px;}
  #schedule-content>.card>div:not(.slot-header)>*{margin:0!important;}
  #lt-mytable .ltbig{display:inline-flex;width:calc(50% - 6px);margin-right:6px;vertical-align:top}
  .modal{max-width:720px;}
  .card:hover{border-color:var(--border2);}
  .task-btn:hover{filter:brightness(1.12);}
  .track-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
  #tab-programma .content,#tab-programma #schedule-content{overflow-y:auto;}
  .tabbar{max-width:none;}
}

@font-face{font-family:'Barlow Condensed';src:url(vendor/fonts/barlow-condensed-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url(vendor/fonts/barlow-condensed-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url(vendor/fonts/barlow-condensed-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url(vendor/fonts/barlow-condensed-latin-800-normal.woff2) format('woff2');font-weight:800 900;font-display:swap}
@font-face{font-family:'Saira Condensed';src:url(vendor/fonts/saira-condensed-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Saira Condensed';src:url(vendor/fonts/saira-condensed-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:'Saira Condensed';src:url(vendor/fonts/saira-condensed-latin-900-normal.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:'Chakra Petch';src:url(vendor/fonts/chakra-petch-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Chakra Petch';src:url(vendor/fonts/chakra-petch-latin-700-normal.woff2) format('woff2');font-weight:700 900;font-display:swap}
body:not(.light){
  --bg:#0d0d0f;--bg2:#16161a;--bg3:#1d1d22;--border:#26262c;--border2:#33333a;
  --text:#f4f1ec;--text2:#d9d4cc;--text3:#a8a39b;--text4:#7a756e;
  --modal-bg:#141417;--input-bg:#0b0b0d;--btn-bg:#1d1d22;
  --accent:#ff5a1f;--accent-dim:rgba(255,90,31,.14);--amber:#f2b544;
  --glass:rgba(13,13,15,.86);--radius:14px;--radius-sm:10px;
}
:root{--rt-orange:#ff5a1f;--rt-live:#4fd69c}
body{font-family:'Barlow Condensed',-apple-system,'Segoe UI',system-ui,sans-serif;letter-spacing:0;font-size:16px}
body:not(.light){background:#0d0d0f}
.header{border-bottom:2px solid var(--rt-orange)}
.header-sub{font-family:'Saira Condensed';font-weight:700;color:var(--rt-orange);letter-spacing:3px;font-size:11px}
.header-title{font-family:'Saira Condensed';font-weight:900;font-style:italic;font-size:26px;text-transform:uppercase;letter-spacing:0}
.header-dot.connected{background:var(--rt-live);box-shadow:0 0 10px var(--rt-live)}
.sync-status{font-family:'Chakra Petch';font-size:11px}.sync-status.ok{color:var(--rt-live)}
.day-tabs{gap:18px;padding:12px 16px 4px}
.day-tab{background:none!important;border:none!important;border-radius:0;padding:4px 0;font-family:'Saira Condensed';font-weight:800;font-size:16px;letter-spacing:.5px;color:var(--text4)}
.day-tab.active{color:var(--text)!important;border-bottom:3px solid var(--rt-orange)!important}
.session-divider{font-family:'Saira Condensed';font-weight:900;font-style:italic;font-size:18px;letter-spacing:.3px;color:var(--text);padding:18px 0 8px}
.session-divider::after{background:var(--border)}
.card{border-color:transparent;box-shadow:none}
.slot-header{gap:10px;margin-bottom:10px}
.slot-time{font-family:'Saira Condensed';font-weight:900;font-style:italic;font-size:26px;letter-spacing:0;color:var(--text3)}
.slot-now .slot-time{color:var(--rt-orange)}
.note-txt{font-size:13px;font-weight:700;font-style:italic;color:#ffcc33;text-shadow:0 0 6px rgba(255,204,51,.55),0 0 1px rgba(255,204,51,.9)}body.light .note-txt{color:#a16207;text-shadow:0 0 4px rgba(250,204,21,.45)}
.lt-tasks{margin-top:8px}.lt-tasks .task-btn{min-height:40px}
.slot-dur{font-family:'Saira Condensed';font-weight:900;font-style:italic;font-size:22px;color:var(--text2);white-space:nowrap}.slot-dur s{color:var(--text4);font-size:16px}.slot-dur b{color:#fbbf24;font-weight:900}
.slot-label{font-family:'Saira Condensed';font-weight:900;font-size:19px;text-transform:uppercase}
.slot-now{border-color:var(--rt-orange)!important;box-shadow:0 0 0 1.5px var(--rt-orange),0 12px 34px -16px rgba(255,90,31,.55)!important}
.now-badge{color:var(--rt-orange);font-family:'Barlow Condensed';font-size:13px;letter-spacing:2px}.now-badge::before{content:'● '}
.card-inner{background:transparent;border:none;border-top:1px solid var(--border);border-radius:0;padding:10px 2px;margin:0}
.inner-num{font-family:'Saira Condensed';font-weight:900;font-style:italic;font-size:27px;line-height:1;min-width:46px}
.inner-name{font-size:17px;font-weight:700;color:var(--text);text-transform:uppercase}
.inner-team-big{font-size:13px;font-weight:600;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.task-btn{border-radius:7px;font-family:'Barlow Condensed';font-weight:700;font-size:13px;letter-spacing:.3px;display:inline-flex;align-items:center;gap:5px;border:none}
.task-btn::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.task-btn.red{background:var(--bg3);color:var(--text4)}.task-btn.red::before{background:#ef6a7a}
.task-btn.orange{background:#3a2e12;color:#f2b544}.task-btn.orange::before{background:#f2b544}
.task-btn.green{background:#14301f;color:#4fd69c}.task-btn.green::before{background:#4fd69c}
.tabbar-lbl{font-family:'Saira Condensed';font-weight:800;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.tabbar-btn.active{color:var(--rt-orange)}
.form-submit{background:var(--rt-orange)}
button,input,textarea,select{font-family:inherit}
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex-shrink:0}

.dotc{display:inline-block;width:12px;height:12px;border-radius:50%}
.tabbar-ico .ic{width:24px;height:24px;vertical-align:0}
.tasks .task-btn{letter-spacing:0!important;font-size:11px!important;gap:3px!important;padding:7px 1px!important;text-overflow:clip}
.tasks .task-btn::before{width:6px!important;height:6px!important}
.slot-label{color:var(--text)!important}
.slot-time{color:var(--text3)}
/* barra di stato sotto l'header */
#rt-statusbar{display:flex;justify-content:space-between;align-items:center;padding:6px 18px;font-family:'Chakra Petch';font-size:12px;font-weight:600;color:var(--text4);background:var(--glass);border-bottom:1px solid var(--border);position:sticky;top:var(--hdr-h,64px);z-index:99}
#rt-statusbar b{color:var(--text)}#rt-statusbar .d{color:var(--rt-orange)}#rt-statusbar .lv{color:var(--rt-live)}#rt-statusbar .off{color:#ff5c7a}
/* scheletro di caricamento */
.skel{border-radius:14px;background:linear-gradient(90deg,#16161a 0%,#222228 50%,#16161a 100%);background-size:200% 100%;animation:skel 1.2s linear infinite;margin:0 0 12px}
@keyframes skel{to{background-position:-200% 0}}
/* animazioni leggere */
.slot-now{animation:nowglow 2.4s ease-in-out infinite}
@keyframes nowglow{50%{box-shadow:0 0 0 1.5px var(--rt-orange),0 12px 40px -10px rgba(255,90,31,.7)}}
.task-btn{transition:background-color .25s,color .25s,transform .12s}
.card,.card-inner{animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Live in palette Carbon */
.pv-switch{gap:0;background:var(--bg3);border-radius:10px;padding:3px}
.pv-btn{border:none!important;border-radius:8px;color:var(--text4);font-family:'Saira Condensed';font-weight:800;font-size:14px;letter-spacing:.5px;padding:8px}
.pv-btn.active{background:var(--bg2)!important;color:var(--text)!important;box-shadow:0 1px 0 rgba(255,255,255,.04),0 4px 12px -6px rgba(0,0,0,.6)}
.ltbig{background:var(--bg2)!important;border:1px solid transparent!important;border-radius:14px;padding:12px 14px;gap:14px;animation:none}
.ltbig.team{background:var(--bg2)!important}
.ltbig .pos{font-family:'Saira Condensed';font-weight:900;font-style:italic;font-size:44px;min-width:56px;color:var(--text);position:relative}
.ltbig .pos .mv{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font-family:'Chakra Petch';font-style:normal;font-size:11px;font-weight:700;padding:0 5px;border-radius:4px}
.ltbig.up{border-color:#4fd69c!important;box-shadow:0 0 0 1px #4fd69c,0 8px 26px -14px #4fd69c}.ltbig.up .mv{background:#14301f;color:#4fd69c}
.ltbig.down{border-color:#ef6a7a!important;box-shadow:0 0 0 1px #ef6a7a}.ltbig.down .mv{background:#2a171b;color:#ef6a7a}
.ltbig .num{font-family:'Saira Condensed';font-weight:900;font-style:italic;font-size:24px;color:var(--rt-orange)}
.ltbig.team .num{color:var(--text3)}
.ltbig .nm{font-size:17px;font-weight:700;text-transform:uppercase}
.ltbig .tm{font-size:13px;font-weight:600;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.ltbig .sub{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:'Chakra Petch';font-size:12px;color:var(--text4);margin-top:5px}.ltbig .sub b{color:var(--text2);font-weight:600}
.ltc tr.mine td{background:rgba(255,90,31,.10);color:var(--text);font-weight:700}.ltc tr.mine td.n{color:#0d0d0f;background:var(--rt-orange)}
.ltc tr.team td{background:var(--bg3);color:var(--text2)}.ltc .best{color:#c9a2ff}.ltc .pb{color:#4fd69c}
.io-btn,.ov-btn{border-color:var(--border2)!important;color:var(--text2)!important;background:var(--bg2)!important}

/* Pulsanti flottanti: area di tocco >=48px, aspetto leggero (vetro) per non coprire i contenuti */
.fab-now{width:56px!important;height:56px!important;background:rgba(255,90,31,.88)!important;color:#0d0d0f!important;font-family:'Saira Condensed';font-weight:900!important;font-size:14px!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 24px -10px rgba(255,90,31,.7)!important}
.fab-top{width:48px!important;height:48px!important;align-items:center;justify-content:center;background:rgba(29,29,34,.55)!important;border:1px solid rgba(255,255,255,.08)!important;color:var(--text2)!important;font-size:20px!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.fab-top:active,.fab-now:active{transform:scale(.92)}

/* Selettori a due parti: indicatore che scorre */
.pv-switch{position:relative;isolation:isolate}
.pv-switch::before{content:'';position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:8px;background:var(--bg2);box-shadow:0 4px 12px -6px rgba(0,0,0,.6);transition:transform .28s cubic-bezier(.22,.85,.26,1)}
.pv-switch:has(.pv-btn:last-child.active)::before{transform:translateX(100%)}
.pv-switch .pv-btn{position:relative;z-index:1;transition:color .25s}
.pv-switch .pv-btn.active{background:transparent!important;box-shadow:none!important}
.pv-switch.anim-r::before{animation:pvR .28s cubic-bezier(.22,.85,.26,1)}
.pv-switch.anim-l::before{animation:pvL .28s cubic-bezier(.22,.85,.26,1)}
@keyframes pvR{from{transform:none}to{transform:translateX(100%)}}
@keyframes pvL{from{transform:translateX(100%)}to{transform:none}}
#lt-mytable.swap-r .ltbig,#lt-mytable.swap-r .ltc{animation:swapR .3s ease-out}
#lt-mytable.swap-l .ltbig,#lt-mytable.swap-l .ltc{animation:swapL .3s ease-out}
@keyframes swapR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes swapL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

/* Selettore a tre parti (Nome/Num · Team · Categoria) con indicatore che scorre */
.adv-search-mode{position:relative;isolation:isolate;display:grid!important;grid-template-columns:repeat(3,1fr);gap:0!important;background:var(--bg3);border-radius:10px;padding:3px;overflow:visible!important}
.adv-search-mode::before{content:'';position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:8px;background:var(--bg2);box-shadow:0 4px 12px -6px rgba(0,0,0,.6);transition:transform .28s cubic-bezier(.22,.85,.26,1)}
.adv-search-mode:has(.adv-mode-btn:nth-child(2).active)::before{transform:translateX(100%)}
.adv-search-mode:has(.adv-mode-btn:nth-child(3).active)::before{transform:translateX(200%)}
.adv-search-mode .adv-mode-btn{position:relative;z-index:1;background:transparent!important;border:none!important;box-shadow:none!important;border-radius:8px;color:var(--text4)!important;font-family:'Saira Condensed';font-weight:800;font-size:13px;padding:9px 4px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:color .25s}
.adv-search-mode .adv-mode-btn.active{color:var(--text)!important}
.view-swap-r{animation:swapR .3s ease-out}.view-swap-l{animation:swapL .3s ease-out}

/* Ordine pulsanti: in cima ↑, in mezzo ORA, in fondo ↓ (centri allineati) */
#fab-bottom{bottom:calc(var(--tab-h) + var(--safe-b) + 16px)!important;right:22px!important}
#fab-now{bottom:calc(var(--tab-h) + var(--safe-b) + 74px)!important;right:18px!important}
#fab-top{bottom:calc(var(--tab-h) + var(--safe-b) + 140px)!important;right:22px!important}
#fab-bottom-piloti{bottom:calc(var(--tab-h) + var(--safe-b) + 16px)!important;right:22px!important}
#fab-top-piloti{bottom:calc(var(--tab-h) + var(--safe-b) + 74px)!important;right:22px!important}

/* Intestazione su una riga: RACE TRACKER · nome gara ........ LIVE · utente */
.header{padding:calc(env(safe-area-inset-top) + 8px) 16px 8px!important;gap:10px}
.header>div:first-child{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.header-title{order:1;font-size:17px!important;line-height:1;white-space:nowrap;flex-shrink:0}
.header-title span{display:none}
.header-sub{order:2;margin:0!important;display:flex;align-items:center;min-width:0;font-family:'Barlow Condensed'!important;font-weight:700!important;font-size:13px!important;letter-spacing:.5px!important;color:var(--text3)!important;text-transform:uppercase}
.header-sub #race-header-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-sub .header-dot{display:none}
.header-right{gap:8px;flex-shrink:0}
#sb-conn{display:none}
#rt-statusbar{justify-content:flex-start;gap:22px}

.scuderia-item{padding:14px 16px!important;font-size:17px!important;font-weight:700!important;display:flex;align-items:center;font-family:'Barlow Condensed'}
.scuderia-item span:last-child{font-size:13px!important}
.scuderia-item.selected{background:var(--bg3)!important;color:var(--text)!important;box-shadow:inset 3px 0 0 var(--rt-orange)}
.scuderia-list{max-height:280px!important}
.prog-filter-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 8px;padding:10px 14px;border-radius:12px;background:var(--bg3);font-size:16px;font-weight:700;text-transform:uppercase}
.prog-filter-chip button{background:none;border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;min-height:40px}
.now-badge{color:var(--rt-live)!important}.now-badge::before{content:'● ';color:var(--rt-live)}

/* Vista "Apex originale" rimossa: resta solo la classifica personalizzata */
#ltv-mia,#ltv-apex{display:none!important}
.pv-switch:has(#ltv-mia){display:none!important}
#lt-wrap,#lt-adjust{display:none!important}
button[onclick="reloadLiveTiming()"]{display:none!important}
/* Transizione al cambio scheda */
.tab-content.tab-in-r{animation:swapR .28s ease-out}.tab-content.tab-in-l{animation:swapL .28s ease-out}
.run-chip{font-family:'Chakra Petch';font-size:11px;font-weight:700;color:var(--text2);background:var(--bg3);border-radius:5px;padding:2px 6px;white-space:nowrap;flex-shrink:0}
.run-chip.done{color:var(--text4)}

/* Schermo intero classifica */
.lt-full-btn{width:100%;min-height:48px;margin:0 0 10px;border-radius:12px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-family:'Saira Condensed';font-weight:800;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
#lt-full{position:fixed;inset:0;z-index:10001;background:#0d0d0f;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body.lt-full-open{overflow:hidden}
body.lt-full-open #rt-alerts,body.lt-full-open #rt-offline,body.lt-full-open .fab-now,body.lt-full-open .fab-top{display:none!important}
.ltf-top{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:2px solid var(--rt-orange);flex-shrink:0}
.ltf-sess{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--text3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltf-lap{font-family:'Chakra Petch';font-weight:700;font-size:20px;color:var(--text);white-space:nowrap}.ltf-lap .ic{color:var(--rt-orange)}
.ltf-close{width:48px;height:48px;border-radius:12px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:22px;cursor:pointer;flex-shrink:0}
.ltf-list{flex:1;min-height:0;overflow:hidden;padding:2px 8px 4px}
.ltf-row{display:flex;align-items:center;gap:8px;height:var(--rh,30px);padding:0 8px;border-bottom:1px solid #1a1a1e;border-radius:6px;font-size:var(--fs,16px);transition:background .3s}
.ltf-row .p{font-family:'Saira Condensed';font-style:italic;font-weight:900;font-size:1.25em;width:2em;text-align:right;color:var(--text)}
.ltf-row .n{font-family:'Chakra Petch';font-weight:700;font-size:.95em;width:2.8em;color:var(--text3)}
.ltf-row .d{flex:1;min-width:0;font-weight:700;font-size:1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltf-row .d small{margin-left:8px;font-size:.75em;color:var(--text4);font-weight:600}
.ltf-row.mine{background:rgba(255,90,31,.14)}.ltf-row.mine .n{color:var(--rt-orange)}.ltf-row.mine .p{color:var(--rt-orange)}
.ltf-row .mv{font-family:'Chakra Petch';font-size:.75em;font-weight:700;padding:0 5px;border-radius:5px}
.ltf-row.up{box-shadow:inset 3px 0 0 #4fd69c}.ltf-row.up .mv{background:#14301f;color:#4fd69c}
.ltf-row.down{box-shadow:inset 3px 0 0 #ef6a7a}.ltf-row.down .mv{background:#2a171b;color:#ef6a7a}
.ltf-empty{padding:30px;text-align:center;color:var(--text4)}
@media (orientation:landscape){.ltf-list{columns:2;column-gap:14px}.ltf-row{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nav-item-icon .ic{width:20px;height:20px}
.card-inner>div:first-child{flex-wrap:wrap;row-gap:0}
.card-inner .inner-team-big{flex-basis:100%;order:9;padding-left:52px;margin-top:-2px}
.tasks{display:flex!important;flex-wrap:nowrap!important;gap:3px!important}
.tasks .task-btn{flex:1 1 0;min-width:0;justify-content:center;padding:7px 2px!important;font-size:11.5px!important;gap:4px;overflow:hidden;white-space:nowrap}
.tasks .task-btn::before{width:6px;height:6px}

/* Calendario gare disponibili */
.cal-orgs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.cal-org{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:700;font-size:13px}
.cal-org.on{background:var(--rt-orange,#ff5a1f);border-color:var(--rt-orange,#ff5a1f);color:#fff}
.cal-month{font-family:'Saira Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--rt-orange,#ff5a1f);margin:14px 0 6px;font-size:14px}
.cal-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.cal-date{flex:0 0 70px;font-family:'Chakra Petch',monospace;font-size:12px;font-weight:700;line-height:1.2}
.cal-main{flex:1;min-width:0}
.cal-name{font-weight:700;font-size:14px}
.cal-sub{font-size:12px;opacity:.75}
.cal-cats{font-size:11px;opacity:.6;margin-top:2px}
.cal-note{font-size:11px;color:#e9b949;margin-top:2px}
.cal-add{flex:0 0 auto;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid #22c55e;background:transparent;color:#22c55e;font-weight:700;font-size:12px}
.cal-added{flex:0 0 auto;font-size:11px;color:#4fd69c;font-weight:700}
.cal-pending{font-size:11px;opacity:.6;margin-top:12px}
.al-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;padding:12px}
.al-time{flex:0 0 auto;font-family:'Chakra Petch',monospace;font-weight:700;font-size:15px;color:var(--text);background:var(--bg3);border-radius:8px;padding:4px 8px}
.cal-sers .cal-org{min-height:40px;font-size:12px;font-weight:600;background:var(--bg3)}
.cal-sers .cal-org.on{background:#fff;color:#111;border-color:#fff}
</style>
</head>

}

let raceListUnsub=null;
let raceDataUnsub=null;

function listenRaces(){
  onValue(ref(db,'races_index'),snap=>{
    races=snap.val()||{};
    dlog('races_index ricevuto: '+Object.keys(races).length+' gare','ok');
    // Sync known users from Firebase to localStorage
    let savedUsers=JSON.parse(localStorage.getItem('rt_users')||'[]');
    Object.values(races).forEach(r=>{
      if(r.knownUsers){Object.keys(r.knownUsers).forEach(u=>{if(!savedUsers.includes(u))savedUsers.push(u);});}
    });
    localStorage.setItem('rt_users',JSON.stringify(savedUsers));
    setSyncStatus('ok');
    // If no active race but races exist, pick first
    if(!activeRaceId||!races[activeRaceId]){
      /* FIX 16/10/2026: niente piu' "prima gara della lista" (era la piu' vecchia, es. ACI con live WSK).
         Si sceglie la gara in corso oggi (startDate<=oggi<=endDate), altrimenti la piu' recente per createdAt. */
      const today=new Date().toISOString().slice(0,10);
      const ids=Object.keys(races).sort((a,b)=>String((races[b]||{}).createdAt||'').localeCompare(String((races[a]||{}).createdAt||'')));
      const live=ids.find(id=>{const r=races[id]||{};return r.startDate&&r.endDate&&r.startDate<=today&&today<=r.endDate;});
      if(ids.length) switchRace(live||ids[0]);
      else{ initialized=true; renderAll(); }
    } else {
      /* FIX 17/10/2026: se la gara salvata e' gia' finita (endDate passata) e c'e' una gara in corso oggi, passa a quella */
      const _t=new Date().toISOString().slice(0,10);
      const _cur=races[activeRaceId]||{};
      const _live=Object.keys(races).find(id=>{const r=races[id]||{};return r.startDate&&r.endDate&&r.startDate<=_t&&_t<=r.endDate;});
      /* 17/10 v2 (idea di Andrea): all'apertura segue il badge IN CORSO (stessa regola: startDate<=oggi<=endDate). Solo al primo caricamento, cosi' una scelta manuale successiva resta. */
      if(_live&&_live!==activeRaceId&&!window._rtAutoPicked){ window._rtAutoPicked=true; switchRace(_live); }
      else { window._rtAutoPicked=true; updateRaceHeader(); if(activeTab==='gare') renderGare(); }
    }
  },err=>{setSyncStatus('err');dlog('❌ races_index: '+err.message,'err');console.error(err);});
}

function listenRaceData(raceId){
  if(raceDataUnsub) raceDataUnsub();
  if(!currentUserId){initialized=true;renderAll();return;}
  
  const sharedRef=ref(db,'races/'+raceId);
  const userRef=ref(db,'races/'+raceId+'/users/'+currentUserId);
  let sharedData={};let userData={};let sharedReady=false;let userReady=false;
  // Modalità senza rete: ultima copia dei dati salvata sul dispositivo, mostrata subito e poi sostituita dai dati live
  window._rtLiveSeen=false;window._rtSnapAt=0;
  const snapKey='rt_snap_'+raceId+'_'+currentUserId;

  function mergeAndRender(){

      if(teamNotes[t.key]===undefined)teamNotes[t.key]='';
    });
    try{checkEliminations();}catch(e){}
    pilots.forEach(p=>{
      if(!p.group)p.group='';if(!p.prefinal)p.prefinal='';if(!p.serie)p.serie='';if(!p.eliminated)p.eliminated=false;
      if(!p.heats)p.heats=[];

      if(p.highlight&&typeof p.highlight==='string')p.highlight=[p.highlight];
      if(p.highlight&&!Array.isArray(p.highlight)&&typeof p.highlight==='object')p.highlight=Object.values(p.highlight);
      if(!p.highlight||!Array.isArray(p.highlight))p.highlight=[];
      if(!statuses[p.num])statuses[p.num]={};
      TASKS.forEach(t=>{if(!statuses[p.num][t])statuses[p.num][t]='red';});

    });
    if(!activeDay||!currentDays.includes(activeDay)) activeDay=currentDays[0]||'';
    setSyncStatus('ok');
    initialized=true;
    renderAll();
  }

  const unsub1=onValue(sharedRef,snap=>{
    sharedData=snap.val()||{};window._rtLiveSeen=true;saveSnap();
    dlog('Dati gara condivisi: entryList='+Object.keys(sharedData.entryList||{}).length+', days='+(sharedData.days||[]).length,'ok');

  const unsub2=onValue(userRef,snap=>{

  },err=>{setSyncStatus('err');dlog('❌ user data: '+err.message,'err');});

  // Storico avvisi condiviso fra i dispositivi dello stesso utente (tel + PC)
  const alertsRef=ref(db,'alertsLog/'+raceId+'/'+currentUserId);
  onValue(alertsRef,snap=>{try{

    const log=alertLog();const have=new Set(log.map(a=>a.id));let added=false;
    remote.forEach(a=>{if(!have.has(a.id)){log.push({id:a.id,title:a.title,sub:a.sub,kind:a.kind||'',hm:a.hm||'',ts:a.ts||0});added=true;}});

    localStorage.setItem(alertKey(raceId),JSON.stringify(log.slice(0,300)));renderAlertLog();
  }catch(e){}});
  raceDataUnsub=()=>{off(sharedRef);off(userRef);off(alertsRef);};

function cycleStatus(cur){const i=STATUS_CYCLE.indexOf(cur);return STATUS_CYCLE[(i+1)%STATUS_CYCLE.length];}
function catClass(cat){
  if(cat==='KZ2')return'cat-kz2';if(cat==='OK')return'cat-ok';if(cat==='OKJ')return'cat-okj';
  if(cat==='MINI GR3')return'cat-gr3';if(cat==='MINI U10')return'cat-u10';if(cat==='OK-NJ')return'cat-nj';if(cat==='OKN')return'cat-okn';return'';
}
// Normalizza i nomi categoria scritti in modi diversi dagli organizzatori
function normCat(c){
  const s=String(c||'').trim().toUpperCase().replace(/\s+/g,' ');
  if(s==='OK-N'||s==='OK N'||s==='OKN')return'OKN';
  if(s==='OKNJ'||s==='OK-N J'||s==='OKN J'||s==='OK-N JUNIOR'||s==='OKN JUNIOR')return'OK-NJ';
  return s;
}

// ── GROUP HELPERS ──
// Normalizza qualsiasi valore gruppo in una singola lettera maiuscola ('A'-'E')
// oppure '' se il valore non è valido.
const VALID_GROUPS=['A','B','C','D','E'];
function normalizeGroup(v){
  if(!v&&v!==0)return'';
  const s=String(v).trim().toUpperCase();
  return VALID_GROUPS.includes(s)?s:'';
}
// Restituisce true se il pilota appartiene a uno dei gruppi nell'array filterArr
// filterArr è sempre un array di lettere, es. ['A','B']
function canonCat(c){
  // Normalizza le diciture categoria tra competizioni (WSK/ACI/ecc.)
  // es. "MINI U10"=="MINI GR3 U10"=="MINI GR.3 U10"; "OK"=="OK-N"; "OKJ"=="OK-N JUNIOR"
  var s=String(c||'').toUpperCase().replace(/[.\-_]/g,'').replace(/\s+/g,'');
  if(s.indexOf('U10')>=0)return 'U10';
  if(s.indexOf('MINI')>=0)return 'MINIGR3';
  if(s.indexOf('KZ2')>=0)return 'KZ2';
  // Famiglia OK*: quattro classi DISTINTE (OK, OKJ, OK-N, OK-N JUNIOR) — match esatto, MAI per prefisso
  if(s==='OK')return 'OK';
  if(s==='OKJ'||s==='OKJUNIOR'||s==='OKJR')return 'OKJ';
  if(s==='OKN')return 'OKN';
  if(s==='OKNJ'||s==='OKNJUNIOR'||s==='OKNJR')return 'OKNJ';
  return s;
}
window.canonCat=canonCat;
function pilotInGroup(pilot,filterArr){
  // NUOVO: se il pilota ha heats[], controlla se questa coppia di gruppi è nella lista
  // es. filterArr=['A','B'] → cerca 'A-B' in pilot.heats
  if(pilot.heats&&Array.isArray(pilot.heats)&&pilot.heats.length){
    const slotKey=filterArr.map(x=>String(x).trim().toUpperCase()).sort().join('-');
    return pilot.heats.some(h=>{
      const hKey=String(h).trim().toUpperCase().split('-').map(x=>x.trim()).sort().join('-');
      return hKey===slotKey;
    });
  }
  // FALLBACK LEGACY: usa group singolo
  const g=normalizeGroup(pilot.group);
  if(!g)return false;
  return filterArr.map(x=>String(x).trim().toUpperCase()).includes(g);
}

// Indica se il pilota ha dati gruppo validi (heats[] nuovo o group legacy)
function pilotHasGroupData(pilot){
  if(pilot.heats&&Array.isArray(pilot.heats)&&pilot.heats.length)return true;
  return!!normalizeGroup(pilot.group);
}

function pilotsForSlot(slot){
  let _pf=false;try{_pf=progFilterOn();}catch(e){}
  return pilots.filter(p=>{
    if(p.eliminated)return false;
    if(_pf&&!myPilotMatches(p,progSearchMode,progSearchTeam,progSearchCat))return false;
    if(canonCat(p.cat)!==canonCat(slot.cat))return false;
    if(slot.type==='all')return true;
    if(slot.type==='parity')return p.parity===slot.filter;
    if(slot.type==='serie'){if(!p.serie)return false;return String(p.serie).trim()===String(slot.filter).trim();}
    if(slot.type==='group')return pilotInGroup(p,slot.filter);
    if(slot.type==='prefinal'){if(!p.prefinal)return false;return String(p.prefinal).trim().toUpperCase()===String(slot.filter).trim().toUpperCase();}
    if(slot.type==='list'){if(!Array.isArray(slot.filter))return false;return slot.filter.map(String).includes(String(p.num));}
    return false;
  });
}
// Pilots of a category that are missing the required assignment for a slot type
function pilotsAwaitingData(slot){
  return pilots.filter(p=>{
    if(p.eliminated)return false;
    if(canonCat(p.cat)!==canonCat(slot.cat))return false;
    if(slot.type==='serie'&&!String(p.serie||'').trim())return true;
    if(slot.type==='group'&&!pilotHasGroupData(p))return true;
    if(slot.type==='prefinal'&&!String(p.prefinal||'').trim())return true;
    return false;
  });
}
function slotFilterLabel(slot){
  if(slot.type==='parity')return slot.filter;
  if(slot.type==='serie')return'SERIE '+slot.filter;
  if(slot.type==='group')return'GRP '+slot.filter.join('+');
  if(slot.type==='prefinal')return'PREF '+slot.filter;
  if(slot.type==='list')return'LIST '+(Array.isArray(slot.filter)?slot.filter.length:0);
  return'ALL';
}

    if(r.ok){const d=await r.json();dlog(d?'✅ /races_index esiste — '+Object.keys(d).length+' gare':'⚠️ /races_index vuoto — nessuna gara creata','ok');}
    else{dlog('❌ /races_index HTTP '+r.status,'err');}
  }catch(e){dlog('❌ /races_index: '+e.message,'err');}

  // Step 4: REST on active race
  if(activeRaceId){
    dlog('Step 4: Test REST /races/'+activeRaceId+'...','info');
    try{
      const r=await fetch('https://karting-tools-default-rtdb.firebaseio.com/races/'+activeRaceId+'.json?shallow=true');
      if(r.ok){const d=await r.json();dlog(d?'✅ Gara attiva OK — chiavi: '+Object.keys(d).join(', '):'⚠️ Gara attiva vuota','ok');}
      else{dlog('❌ Gara attiva HTTP '+r.status,'err');}
    }catch(e){dlog('❌ Gara attiva: '+e.message,'err');}
  } else {
    dlog('Step 4: Nessuna gara attiva selezionata','warn');
  }

  // Step 5: SDK WebSocket test
  dlog('Step 5: Test SDK .info/connected...','info');
  onValue(ref(db,'.info/connected'),snap=>{
    if(snap.val()===true)dlog('✅ WebSocket CONNESSO','ok');
    else dlog('⚠️ WebSocket non connesso','warn');
  },{onlyOnce:true});

  // Step 6: SDK write test
  dlog('Step 6: Test SDK scrittura...','info');
  try{
    await set(ref(db,'_test_ping'),{t:Date.now()});
    dlog('✅ Scrittura SDK OK','ok');
    await set(ref(db,'_test_ping'),null); // cleanup
  }catch(e){
    dlog('❌ Scrittura SDK fallita: '+e.message,'err');
    if(e.message.includes('PERMISSION_DENIED'))dlog('→ Le Firebase Rules bloccano la scrittura! Controlla le rules nella console Firebase.','err');
  }

  // Step 7: State summary
  dlog('Step 7: Stato app...','info');
  dlog('Race ID: '+(activeRaceId||'NESSUNA'),'info');
  dlog('Gare caricate: '+Object.keys(races).length,'info');
  dlog('Piloti: '+pilots.length,'info');
  dlog('Entry list: '+Object.keys(currentEntryList).length+' piloti','info');
  dlog('Schedule: '+currentDays.length+' giorni','info');
  dlog('URL: '+location.href,'info');
  dlog('Test completato ✓','ok');
}

function renderGare(){
  const el=document.getElementById('gare-content');
  const raceIds=Object.keys(races);
  let html='<div style="margin-bottom:16px">'
    +'<button class="mgmt-btn" onclick="openCalendar()" style="border-color:var(--rt-orange,#ff5a1f);color:var(--rt-orange,#ff5a1f);margin-bottom:8px"><i class="ic ic-calendar"></i> GARE DISPONIBILI</button>'
    +'<button class="mgmt-btn" onclick="openNewRace()" style="border-color:#22c55e;color:#22c55e">+ NUOVA GARA</button></div>';

  if(!raceIds.length){
    html+='<div class="empty-state"><p>Nessuna gara. Creane una!</p><p style="margin-top:8px;font-size:11px">Oppure i dati della gara WSK attuale verranno migrati automaticamente.</p></div>';
  } else {
    // Sort by startDate (earliest first), races without dates go to end
    const sorted=raceIds.map(id=>({id,...races[id]})).sort((a,b)=>{
      const da=a.startDate||'9999';const db2=b.startDate||'9999';
      return da.localeCompare(db2);
    });

    const today=new Date().toISOString().split('T')[0];
    let closestIdx=-1;let closestDiff=Infinity;

    html+='<div style="font-size:10px;color:var(--text4);font-weight:700;letter-spacing:1px;margin-bottom:10px">'+raceIds.length+' GARE</div>';
    sorted.forEach((r,idx)=>{
      const id=r.id;
      const isActive=id===activeRaceId;
      const entryCount=r.entryCount||0;
      const pilotCount=isActive?pilots.length:(r.pilotCount||0);
      const startD=r.startDate||'';
      const endD=r.endDate||'';

      // Find closest race to today for auto-scroll
      if(startD){
        const diff=Math.abs(new Date(startD)-new Date(today));
        // Prefer ongoing races (today between start and end)
        const isOngoing=startD<=today&&(endD>=today||!endD);
        if(isOngoing){closestIdx=idx;closestDiff=-1;}
        else if(closestDiff>0&&diff<closestDiff){closestDiff=diff;closestIdx=idx;}
      }

      // Format dates
      let dateStr='';
      if(startD&&endD){
        const s=formatDateShort(startD);const e=formatDateShort(endD);
        dateStr=s+' → '+e;
      } else if(startD){
        dateStr='Dal '+formatDateShort(startD);
      }

      // Is this race ongoing?
      const isOngoing=startD&&startD<=today&&(endD>=today||!endD);

      html+='<div class="race-card'+(isActive?' active-race':'')+'" id="race-card-'+idx+'" onclick="switchRaceAndRender(\''+id+'\')">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
        +'<div><div class="race-name">'+r.name+(isActive?'<span class="race-badge">ATTIVA</span>':'')+'</div>'
        +'<div class="race-meta">'+(r.circuit||'')+(dateStr?' · '+dateStr:'')+'</div>'
        +'<div class="race-meta" style="margin-top:2px">'+pilotCount+' miei piloti · '+entryCount+' in entry list</div></div>'
        +(isOngoing?'<span style="font-size:9px;font-weight:800;color:#22c55e;border:1px solid #22c55e;padding:2px 8px;border-radius:4px;white-space:nowrap">IN CORSO</span>':'')
        +'</div>'
        +'<div style="display:flex;gap:6px;margin-top:10px">'
        +'<button class="io-btn" style="font-size:10px;padding:8px" onclick="event.stopPropagation();openRaceSettings(\''+id+'\')"><i class="ic ic-gear"></i> IMPOSTAZIONI</button>'
        +(isActive?'':'<button class="io-btn" style="font-size:10px;padding:8px;border-color:#ef4444;color:#ef4444" onclick="event.stopPropagation();deleteRace(\''+id+'\')">✕ ELIMINA</button>')
        +'</div></div>';
    });

    // Auto-scroll to closest race
    if(closestIdx>=0){
      setTimeout(()=>{
        const card=document.getElementById('race-card-'+closestIdx);
        if(card)card.scrollIntoView({behavior:'smooth',block:'center'});
      },100);
    }
  }
  el.innerHTML=html;
}

function formatDateShort(dateStr){
  if(!dateStr)return'';
  const d=new Date(dateStr+'T00:00:00');
  const months=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  return d.getDate()+' '+months[d.getMonth()];
}

function ltGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
function ltSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function liveCropPx(){const v=parseInt(ltGet('rt_lt_crop2','560'),10);return isNaN(v)?560:v;}

function applyLiveCrop(){
  const f=document.getElementById('live-timing-frame');if(!f)return;
  /* LIVE TIMING - RITAGLIO ALTO DISATTIVATO (27/09/2026, gara Viterbo).
   Motivo: le pagine degli organizzatori (es. YouCrono) sono contenitori con banner/header che
   incorporano il vero live timing Apex/LSTiming in un iframe. Il tasto "fullscreen" (4 frecce) del
   live Apex apre la pagina interna a se stante (link_fullscreen con href vuoto, vedi
   apex-timing.com/live-timing/commonv2/javascript/javascript_live_timing.min.js, fn tzfhv).
   Embeddando DIRETTAMENTE l'URL interno (es. https://www.apex-timing.com/live-timing/wsk/index.html)
   la pagina e' gia' pulita: nessun ritaglio necessario. Crop forzato a 0 e controlli nascosti.
   Per una nuova gara: nel campo URL Live Timing mettere l'<iframe src> interno, non la pagina contenitore. */
  // 13/11/2026: riattivato su richiesta di Andrea. Nella vista "Apex originale" si nasconde la parte alta
  // (commenti, migliori settori, mappa, loghi) e si parte dalla striscia "Next" in giù. Regolabile con −/+.
  let _v='mia';try{_v=ltView;}catch(e){_v=ltGet('rt_ltview','mia');}const on=_v==='apex';const px=on?liveCropPx():0;
  f.style.top=(-px)+'px';
  f.style.height='calc(100% + '+px+'px)';
  const adj=document.getElementById('lt-adjust');if(adj)adj.style.display=on?'flex':'none';

}
function nudgeLiveCrop(d,reset){
  if(reset){ltSet('rt_lt_crop2','560');applyLiveCrop();return;}

}

// ── CALENDARIO GARE DISPONIBILI (dati da calendar.json, solo fonti ufficiali) ──
let calData=null,calOrg='',calSer='',calQ='';
const calSeriesOf=e=>String(e.name).replace(/\s+R\d+$/,'').replace(/\s+20\d\d$/,'').replace(/^\d+°\s+/,'');
const CAL_MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
function calFmt(ev){
  if(!ev.dateFrom)return 'Data da annunciare';
  const a=ev.dateFrom.split('-'),b=(ev.dateTo||ev.dateFrom).split('-');
  const p=[];
  if(a[1]===b[1]){p.push(String(+a[2]),'–',String(+b[2]),' ',CAL_MONTHS[+a[1]-1].slice(0,3));}
  else{p.push(String(+a[2]),' ',CAL_MONTHS[+a[1]-1].slice(0,3),' – ',String(+b[2]),' ',CAL_MONTHS[+b[1]-1].slice(0,3));}
  return p.join('');
}
function calAdded(ev){
  return Object.keys(races||{}).some(id=>{const r=races[id]||{};return r.calId===ev.id||(r.name===ev.name&&ev.dateFrom&&r.startDate===ev.dateFrom);});
}
function openCalendar(){
  calQ='';
  openModal('<button class="modal-close" onclick="closeModal()">✕</button><div class="modal-title">Gare disponibili</div><input id="cal-q" type="search" placeholder="Cerca gara, circuito, città…" oninput="calQ=this.value;renderCalendar()" autocomplete="off" style="width:100%;min-height:44px;margin:0 0 10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border,#333);background:var(--bg2,#151518);color:var(--text,#eee);font-size:15px;box-sizing:border-box"><div id="cal-body"><div class="empty-state"><p>Caricamento…</p></div></div>');
  if(calData){renderCalendar();return;}
  fetch('calendar.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{calData=d;renderCalendar();}).catch(()=>{
    const el=document.getElementById('cal-body');if(el)el.innerHTML='<div class="empty-state"><p>Calendario non disponibile offline.</p></div>';
  });
}
function setCalOrg(o){calOrg=o;calSer='';renderCalendar();}
function setCalSer(i){const l=window._calSerList||[];calSer=i<0?'':l[i];renderCalendar();}
function renderCalendar(){
  const el=document.getElementById('cal-body');if(!el||!calData)return;
  const today=new Date().toISOString().slice(0,10);
  const base=calData.events.filter(e=>!(e.dateTo&&e.dateTo<today)&&(!calOrg||e.org===calOrg));
  const sers=calOrg?[...new Set(base.map(calSeriesOf))]:[];window._calSerList=sers;
  const q=String(calQ||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const evs=base.filter(e=>(!calSer||calSeriesOf(e)===calSer)&&(!q||[e.name,e.series,e.org,e.circuit,e.city,(e.cats||[]).join(' ')].join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q)));
  const orgs=[...new Set(calData.events.map(e=>e.org))];
  const h=[];
  h.push('<div class="cal-orgs">');
  [''].concat(orgs).forEach(o=>{
    const lab=o?((ORG_CONFIG[o]||{}).label||o):'Tutte';
    h.push(`<button class="cal-org${o===calOrg?' on':''}" onclick="setCalOrg('${o}')">${lab}</button>`);
  });
  h.push('</div>');
  if(sers.length>1){
    h.push('<div class="cal-orgs cal-sers">');
    h.push(`<button class="cal-org${calSer?'':' on'}" onclick="setCalSer(-1)">Tutte</button>`);
    sers.forEach((x,i)=>h.push(`<button class="cal-org${x===calSer?' on':''}" onclick="setCalSer(${i})">${x.replace(new RegExp('^('+calOrg+'|Rotax MAX Challenge|Champions of the Future|Tillotson|FIA Karting)\\s+','i'),'')}</button>`));
    h.push('</div>');
  }
  const groups={};
  if(!evs.length)h.push('<div class="empty-state"><p>Nessuna gara trovata'+(q?' per “'+String(calQ).replace(/[<>&"]/g,'')+'”':'')+'.</p></div>');
  evs.forEach(e=>{const k=e.month||'zz';(groups[k]=groups[k]||[]).push(e);});
  Object.keys(groups).sort().forEach(k=>{
    const t=k==='zz'?'Data da annunciare':[CAL_MONTHS[+k.slice(5,7)-1],k.slice(0,4)].join(' ');
    h.push(`<div class="cal-month">${t}</div>`);
    groups[k].sort((x,y)=>(x.dateFrom||'9').localeCompare(y.dateFrom||'9')||String(x.org).localeCompare(String(y.org))).forEach(e=>{
      const added=calAdded(e);
      const cats=(e.cats||[]).join(' · ');
      h.push(`<div class="cal-item"><div class="cal-date">${calFmt(e)}</div><div class="cal-main">`);
      h.push(`<div class="cal-name">${e.name}</div><div class="cal-sub">${[e.circuit,e.city].filter(Boolean).join(' — ')}</div>`);
      if(cats)h.push(`<div class="cal-cats">${cats}</div>`);
      if(e.status!=='confermato'||e.note)h.push(`<div class="cal-note">${[e.status==='confermato'?'':'Provvisorio',e.note||''].filter(Boolean).join(' · ')}</div>`);

      h.push('</div>');
    });
  });
  if(!evs.length)h.push('<div class="empty-state"><p>Nessuna gara.</p></div>');

  h.push(`<div class="cal-pending">Aggiornato al ${calData.updated.split('-').reverse().join('/')} · verifica sempre sul sito ufficiale</div>`);
  el.innerHTML=h.join('');
}

function applyWSKHeats(raceId){
  const el=document.getElementById('wsk-paste-input');
  if(!el||!el.value.trim()){alert('Incolla il JSON prima');return;}
  try{
    const data=JSON.parse(el.value.trim());
    if(!Array.isArray(data))throw new Error('Formato non valido');
    // Usa uploadAssignments logic direttamente
    const assignMap={};
    data.forEach(a=>{
      const num=a.num?a.num.toString():'';
      if(num&&a.heats)assignMap[num]=a;
    });
    let updated=0;let notFound=0;
    pilots.forEach(p=>{
      const a=assignMap[p.num];
      if(a){
        if(a.heats&&a.heats.length){p.heats=a.heats.map(h=>String(h).trim().toUpperCase());p.group='';}
        if(a.prefinal!==undefined)p.prefinal=a.prefinal;
        if(a.inFinal!==undefined)p.inFinal=a.inFinal;
        updated++;
      } else {
        notFound++;
      }
    });
    // Aggiorna entry list condivisa
    const entryUpdates={};
    data.forEach(a=>{
      const anum=a.num?a.num.toString():'';
      if(anum&&currentEntryList[anum]&&a.heats){
        entryUpdates['races/'+raceId+'/entryList/'+anum+'/heats']=a.heats.map(h=>String(h).trim().toUpperCase());
        entryUpdates['races/'+raceId+'/entryList/'+anum+'/group']='';
      }
    });
    if(Object.keys(entryUpdates).length)update(ref(db),entryUpdates);
    saveAll();
    alert('✅ Heats aggiornate!\n'+updated+' tuoi piloti aggiornati'+(notFound?' ('+notFound+' non trovati tra i tuoi piloti)':''));
    closeModal();
  }catch(e){alert('❌ JSON non valido: '+e.message);}
}

function uploadEntryList(event,raceId){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      // Accept either {num:{...}} or [{num,lastName,...}]
      let entryList={};
      if(Array.isArray(data)){
        data.forEach(d=>{if(d.num)entryList[d.num.toString()]=d;});
      } else {
        entryList=data;
      }
      Object.values(entryList).forEach(d=>{if(d&&d.cat)d.cat=normCat(d.cat);});
      const count=Object.keys(entryList).length;
      const u={};
      u['races/'+raceId+'/entryList']=entryList;
      u['races_index/'+raceId+'/entryCount']=count;
      update(ref(db),u).then(()=>{alert('✅ Entry list caricata: '+count+' piloti');closeModal();});
    }catch(err){alert('❌ File non valido');}
  };
  reader.readAsText(file);event.target.value='';
}
