# Netlify: solo per la copia di prova (racetracker-prova.netlify.app). L'app vera resta su GitHub Pages.
[build]
  publish = "."
  command = ""
  # 14/11: pubblica la copia di prova solo se cambiano i suoi file (ogni deploy consuma crediti Netlify)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- kart_staging.html prova/ orgs.json sw.js manifest_staging.webmanifest icons/ vendor/ netlify.toml"
[[redirects]]
  from = "/"
  to = "/kart_staging.html"
  status = 302
  force = true
