<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scaletta Lonato Venerdì</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.back{display:inline-block;margin-bottom:10px;font-weight:600;color:var(--accent);text-decoration:none;font-size:15px}
/* Layout: una colonna da telefono, timeline verticale; blocco "ora" evidenziato; spuntare per segnare fatto */
:root{
  --bg:#f3f2ee;--card:#ffffff;--fg:#17181a;--muted:#6a6c70;--line:#dcdad3;
  --accent:#d6331f;--move:#8a8c90;--done:#2e8b4e;--now:#fff1d6;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;--f-body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--card:#1c1d20;--fg:#f1f0ec;--muted:#9a9ca1;--line:#2c2e32;--accent:#ff5a3d;--move:#6f7176;--done:#4cc27a;--now:#3a2a12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121315;--card:#1c1d20;--fg:#f1f0ec;--muted:#9a9ca1;--line:#2c2e32;--accent:#ff5a3d;--move:#6f7176;--done:#4cc27a;--now:#3a2a12;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:640px;margin:0 auto}
h1{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.5px;margin:0;text-transform:uppercase}
.sub{color:var(--muted);font-size:14px;margin:2px 0 14px}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:1px;margin:24px 0 8px;color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:62px 1fr 34px;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row.move{background:transparent;border:1px dashed var(--line);padding:6px 12px;color:var(--move);font-size:14px}
.row.now{background:var(--now);border-color:var(--accent);border-width:2px}
.row.done{opacity:.45}
.row.done .what{text-decoration:line-through}
.t{font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.t small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.where{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.8px;font-size:15px;color:var(--accent)}
.what{min-width:0;font-size:15px}
.what b{font-weight:600}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--done);font-size:18px;font-weight:800;cursor:pointer;padding:0}
.row.done .chk{border-color:var(--done)}
.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tomorrow .row{grid-template-columns:62px 1fr 34px}
.pill{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:4px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin-top:8px}
</style>
</head><body>
<a class="back" href="kart_test50.html">← Torna all'app</a>

<h1>Scaletta venerdì</h1>
<div class="sub">ROK Superfinal · Lonato · pettorina dalle 13:10 · tocca ✓ quando hai fatto</div>

<h2>Oggi pomeriggio</h2>
<div class="list" id="oggi"></div>

<h2>Rimandati a domani</h2>
<div class="list tomorrow" id="domani"></div>
<div class="note">Il programma di sabato arriva stasera, con le prefinali A/B.</div>

<script>
const OGGI=[
 ["13:20","13:25","Pregriglia","<b>#154</b> e <b>#152</b>: veloce, kart + casco + team"],
 ["13:25","13:30","→ pista",null],
 ["13:28","13:42","Pista","<b>#154</b> tutti i giri (Mini B-D)"],
 ["13:42","13:47","→ bilancia",null],
 ["13:47","13:52","Bilancia","<b>#154</b> e <b>#152</b>: arrivo, casco tolto, faccia"],
 ["13:52","13:58","Pregriglia","<b>#30</b> e <b>#42</b>: pregriglia completa (U10 B-D)"],
 ["13:58","14:00","→ pista bassa",null],
 ["14:00","14:12","Pista bassa","<b>#22</b>, <b>#30</b>, <b>#42</b> (U10 B-D)"],
 ["14:12","14:17","Bilancia","<b>#22</b>, <b>#30</b>, <b>#42</b>"],
 ["14:17","14:22","→ pista",null],
 ["14:22","14:32","Pista sotto","<b>#622</b> (nessuna pista) · <b>#602</b> parte sotto (Super)"],
 ["14:32","15:12","Paddock","<b>#154</b> tutto (paddock, reportage, team) · <b>#32</b> viso senza casco · reportage <b>#30 #42 #26 #22 #41</b> · tenda <b>#622</b>"],
 ["15:12","15:22","Pregriglia","<b>#236</b>, <b>#248</b>, <b>#221</b> (Junior A-D)"],
 ["15:22","15:27","→ pista",null],
 ["15:27","15:39","Pista sotto+sopra","<b>#236</b>: sotto, sopra, interno sopra"],
 ["15:39","15:44","Bilancia","<b>#236</b>"],
 ["15:44","16:15","Paddock","paddock <b>#236 #248 #221 #216</b> · bilancia <b>#216</b> dopo le 15:54 · reportage <b>#465</b>"]
];
const DOMANI=[
 ["#16","pista alta, bilancia, reportage"],
 ["#26","pista alta interno"],
 ["#41 #32","bilancia"],
 ["#215","pregriglia"],
 ["#954","pista + pregriglia · warm-up 9:15"],
 ["#918","pista + pregriglia · warm-up 9:20"],
 ["#206","reportage · prefinale Junior"]
];
const KEY='scaletta_ven_1610';
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
const mins=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
function render(){
  const now=new Date();const nm=now.getHours()*60+now.getMinutes();
  document.getElementById('oggi').innerHTML=OGGI.map((r,i)=>{
    const id='o'+i;const isNow=nm>=mins(r[0])&&nm<mins(r[1]);
    if(!r[3])return '<div class="row move'+(isNow?' now':'')+'"><div class="t" style="font-size:15px">'+r[0]+'</div><div>'+r[2]+'</div><div></div></div>';
    return '<div class="row'+(isNow?' now':'')+(done[id]?' done':'')+'" id="r-'+id+'"><div class="t">'+r[0]+'<small>→ '+r[1]+'</small></div><div class="what"><div class="where">'+r[2]+(isNow?'<span class="pill">ADESSO</span>':'')+'</div>'+r[3]+'</div><button class="chk" id="c-'+id+'" aria-label="Segna fatto" onclick="tog(\''+id+'\')">'+(done[id]?'✓':'')+'</button></div>';
  }).join('');
  document.getElementById('domani').innerHTML=DOMANI.map((r,i)=>{const id='d'+i;return '<div class="row'+(done[id]?' done':'')+'"><div class="t" style="font-size:17px">'+r[0]+'</div><div class="what">'+r[1]+'</div><button class="chk" id="c-'+id+'" aria-label="Segna fatto" onclick="tog(\''+id+'\')">'+(done[id]?'✓':'')+'</button></div>'}).join('');
}
function tog(id){done[id]=!done[id];save();render();}
render();setInterval(render,30000);
</script>

</body></html>
